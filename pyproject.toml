[project]
name = "2026-fortuna-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "google-cloud-storage>=3.0.0",
    "google-cloud-texttospeech>=2.0.0",
    "google-genai>=1.0.0",
    "greenlet>=3.5.1",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.12.1",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.29",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
# Using ruff's default lint rules (pyflakes + select pycodestyle) for now.
# Formatting is intentionally not enforced in CI yet; run `uv run ruff format`
# as a separate cleanup before turning it on.
